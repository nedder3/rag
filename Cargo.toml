[package]
name = "rag"
version = "0.1.0"
edition = "2021"
description = "High-performance Hybrid Vector (pgvector HNSW) + Full-Text (tsvector GIN) RRF + Graph A* RAG service & MCP server in Rust"
license = "MIT"

[lib]
name = "rag"
path = "src/lib.rs"

[[bin]]
name = "rag-server"
path = "src/bin/rag_server.rs"

[[bin]]
name = "rag-mcp"
path = "src/bin/rag_mcp.rs"

[[bin]]
name = "rag-eval"
path = "src/bin/rag_eval.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "json", "migrate", "macros"] }
pgvector = { version = "0.4", features = ["sqlx"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lru = "0.12"
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
